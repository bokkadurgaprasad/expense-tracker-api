<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer coin circle with gradient -->
  <defs>
    <linearGradient id="coinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="shine" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#FFFFE0;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Main coin body -->
  <circle cx="50" cy="50" r="48" fill="url(#coinGradient)" stroke="#B8860B" stroke-width="2"/>
  
  <!-- Inner circle detail -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#DAA520" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Shine effect -->
  <circle cx="50" cy="50" r="48" fill="url(#shine)" opacity="0.4"/>
  
  <!-- Currency symbol -->
  <text x="50" y="68" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#8B4513" text-anchor="middle">₹</text>
  
  <!-- Shadow for depth -->
  <ellipse cx="50" cy="95" rx="35" ry="3" fill="#000" opacity="0.2"/>
</svg>
